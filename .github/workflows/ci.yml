# CI/CD workflow for Chrome Extension
name: CI

# Trigger the workflow on push and pull requests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  pull_request_target:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

# Set workflow permissions
permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

# Cancel previous runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Environment variables
env:
  NODE_VERSION: '18'
  EXTENSION_DIR: 'gemini-summarizer'

# Define the jobs to run
jobs:
  # Pre-flight checks for PR validation
  pr-checks:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    
    steps:
    - name: Checkout PR code
      uses: actions/checkout@v4
      with:
        # For pull_request_target, we check out the PR head
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    
    - name: Check PR title and description
      run: |
        echo "🔍 Validating PR metadata..."
        
        # Check PR title
        PR_TITLE="${{ github.event.pull_request.title }}"
        if [ -z "$PR_TITLE" ]; then
          echo "❌ PR title is empty"
          exit 1
        fi
        
        # Check for meaningful PR title (not just "Update" or "Fix")
        if echo "$PR_TITLE" | grep -qE "^(Update|Fix|Change)$"; then
          echo "⚠️ PR title should be more descriptive: '$PR_TITLE'"
        fi
        
        echo "✅ PR title: $PR_TITLE"
        
        # Check PR description
        PR_BODY="${{ github.event.pull_request.body }}"
        if [ -z "$PR_BODY" ] || [ "$PR_BODY" = "null" ]; then
          echo "⚠️ PR description is empty. Consider adding a description."
        else
          echo "✅ PR has description"
        fi
    
    - name: Check for breaking changes
      run: |
        echo "🔍 Checking for breaking changes..."
        
        # Check if manifest version changed
        if git diff --name-only origin/main..HEAD | grep -q "$EXTENSION_DIR/manifest.json"; then
          echo "⚠️ manifest.json was modified - please review for breaking changes"
          
          # Show the diff for manifest.json
          echo "📋 Manifest changes:"
          git diff origin/main..HEAD -- $EXTENSION_DIR/manifest.json || true
        fi
        
        # Check for major file deletions
        DELETED_FILES=$(git diff --name-status origin/main..HEAD | grep "^D" | wc -l)
        if [ "$DELETED_FILES" -gt 0 ]; then
          echo "⚠️ $DELETED_FILES file(s) were deleted:"
          git diff --name-status origin/main..HEAD | grep "^D" || true
        fi
        
        echo "✅ Breaking changes check completed"
    
    - name: Validate changed files
      run: |
        echo "🔍 Validating changed files..."
        
        # Get list of changed files
        CHANGED_FILES=$(git diff --name-only origin/main..HEAD)
        
        if [ -z "$CHANGED_FILES" ]; then
          echo "ℹ️ No files changed in this PR"
          exit 0
        fi
        
        echo "📝 Changed files:"
        echo "$CHANGED_FILES"
        
        # Check if any JavaScript files were changed
        JS_CHANGED=$(echo "$CHANGED_FILES" | grep -E "\.(js|json)$" | wc -l)
        if [ "$JS_CHANGED" -gt 0 ]; then
          echo "✅ JavaScript/JSON files changed: $JS_CHANGED"
        fi
        
        # Check if any critical files were changed
        CRITICAL_FILES="manifest.json background.js popup.js"
        for file in $CRITICAL_FILES; do
          if echo "$CHANGED_FILES" | grep -q "$file"; then
            echo "⚠️ Critical file modified: $file"
          fi
        done
    
    outputs:
      has-changes: ${{ steps.check-changes.outputs.has-changes }}

  # Main validation job
  validate:
    name: Validate Extension
    runs-on: ubuntu-latest
    # Run for all events, but depend on pr-checks for PRs
    needs: [pr-checks]
    if: always() && (needs.pr-checks.result == 'success' || github.event_name == 'push')
    
    steps:
    # Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # For PR events, checkout the PR head
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    
    # Set up Node.js environment
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'package.json'
    
    # Validate manifest.json structure
    - name: Validate manifest.json
      run: |
        echo "🔍 Checking manifest.json syntax..."
        MANIFEST_FILE="$EXTENSION_DIR/manifest.json"
        
        if [ ! -f "$MANIFEST_FILE" ]; then
          echo "❌ manifest.json not found at $MANIFEST_FILE"
          exit 1
        fi
        
        if ! cat "$MANIFEST_FILE" | jq empty; then
          echo "❌ manifest.json is not valid JSON"
          exit 1
        else
          echo "✅ manifest.json is valid JSON"
        fi
        
        # Extract and display key manifest info
        NAME=$(cat "$MANIFEST_FILE" | jq -r '.name')
        VERSION=$(cat "$MANIFEST_FILE" | jq -r '.version')
        MANIFEST_VERSION=$(cat "$MANIFEST_FILE" | jq -r '.manifest_version')
        
        echo "📋 Extension Info:"
        echo "  Name: $NAME"
        echo "  Version: $VERSION"
        echo "  Manifest Version: $MANIFEST_VERSION"
        
        # Validate manifest version
        if [ "$MANIFEST_VERSION" != "3" ]; then
          echo "❌ Extension must use Manifest V3 (found: $MANIFEST_VERSION)"
          exit 1
        fi
        
        echo "✅ Manifest validation completed"
    
    # Check for required files
    - name: Check required files
      run: |
        echo "🔍 Checking for required extension files..."
        
        # Core extension files
        required_files=(
          "manifest.json"
          "popup.html"
          "popup.js"
          "background.js"
          "content.js"
          "styles.css"
          "config.js"
          "notionUtils.js"
          "weeklyRecap.js"
        )
        
        # Module directories and files
        required_modules=(
          "services/apiService.js"
          "utils/domUtils.js"
          "utils/validation.js"
          "ui/popupController.js"
        )
        
        # Required directories
        required_dirs=(
          "services"
          "utils"
          "ui"
          "images"
        )
        
        # Check core files
        echo "📁 Checking core files..."
        for file in "${required_files[@]}"; do
          full_path="$EXTENSION_DIR/$file"
          if [ -f "$full_path" ]; then
            echo "✅ $file exists"
          else
            echo "❌ $file is missing"
            exit 1
          fi
        done
        
        # Check module files
        echo "📁 Checking module files..."
        for file in "${required_modules[@]}"; do
          full_path="$EXTENSION_DIR/$file"
          if [ -f "$full_path" ]; then
            echo "✅ $file exists"
          else
            echo "❌ Module file missing: $file"
            exit 1
          fi
        done
        
        # Check directories
        echo "📁 Checking directories..."
        for dir in "${required_dirs[@]}"; do
          full_path="$EXTENSION_DIR/$dir"
          if [ -d "$full_path" ]; then
            echo "✅ Directory exists: $dir"
          else
            echo "❌ Directory missing: $dir"
            exit 1
          fi
        done
        
        echo "✅ All required files and directories found"
    
    # Basic JavaScript syntax check
    - name: Check JavaScript syntax
      run: |
        echo "🔍 Checking JavaScript files for syntax errors..."
        
        # Create a temporary package.json to enable ES modules
        TEMP_PACKAGE="$EXTENSION_DIR/package.json"
        echo '{"type": "module"}' > "$TEMP_PACKAGE"
        
        # All JavaScript files to check
        js_files=(
          "popup.js"
          "background.js"
          "content.js"
          "notionUtils.js"
          "weeklyRecap.js"
          "config.js"
          "services/apiService.js"
          "utils/domUtils.js"
          "utils/validation.js"
          "ui/popupController.js"
        )
        
        echo "📝 Checking ${#js_files[@]} JavaScript files..."
        
        for file in "${js_files[@]}"; do
          full_path="$EXTENSION_DIR/$file"
          if [ -f "$full_path" ]; then
            if node --check "$full_path" 2>/dev/null; then
              echo "✅ $file syntax is valid"
            else
              echo "❌ $file has syntax errors:"
              node --check "$full_path"
              rm -f "$TEMP_PACKAGE"
              exit 1
            fi
          else
            echo "⚠️ $file not found, skipping syntax check"
          fi
        done
        
        # Clean up temporary package.json
        rm -f "$TEMP_PACKAGE"
        echo "✅ All JavaScript files have valid syntax"
    
    # Validate HTML structure
    - name: Check HTML files
      run: |
        echo "🔍 Checking HTML files..."
        HTML_FILE="$EXTENSION_DIR/popup.html"
        
        if [ -f "$HTML_FILE" ]; then
          # Basic HTML validation
          if grep -q "<html>" "$HTML_FILE" && grep -q "</html>" "$HTML_FILE"; then
            echo "✅ popup.html has basic HTML structure"
          else
            echo "❌ popup.html is missing basic HTML structure"
            exit 1
          fi
          
          # Check for required elements
          required_elements=(
            "gemini-api-key"
            "save-api-key"
            "summarize-btn"
            "weekly-recap-btn"
            "notion-api-key"
            "notion-database-id"
          )
          
          echo "📝 Checking required HTML elements..."
          for element in "${required_elements[@]}"; do
            if grep -q "id=\"$element\"" "$HTML_FILE"; then
              echo "✅ Element found: #$element"
            else
              echo "❌ Required element missing: #$element"
              exit 1
            fi
          done
          
          echo "✅ HTML structure validation completed"
        else
          echo "❌ popup.html not found"
          exit 1
        fi
    
    # Check for common security issues
    - name: Basic security check
      run: |
        echo "🔒 Running security checks..."
        
        # Define security patterns to check
        declare -A security_patterns=(
          ["sk-"]="OpenAI API key"
          ["AIza"]="Google API key"
          ["secret_"]="Notion secret"
          ["ghp_"]="GitHub token"
          ["xox"]="Slack token"
          ["AKIA"]="AWS access key"
        )
        
        SECURITY_ISSUES=0
        
        for pattern in "${!security_patterns[@]}"; do
          description="${security_patterns[$pattern]}"
          echo "🔍 Checking for $description patterns..."
          
          if grep -r "$pattern" "$EXTENSION_DIR/" --include="*.js" --include="*.json" --include="*.html" 2>/dev/null; then
            echo "⚠️ Warning: Potential $description found with pattern '$pattern'"
            SECURITY_ISSUES=1
          fi
        done
        
        # Check for other security issues
        echo "🔍 Checking for eval() usage..."
        if grep -r "eval(" "$EXTENSION_DIR/" --include="*.js" 2>/dev/null; then
          echo "⚠️ Warning: eval() usage found - potential security risk"
          SECURITY_ISSUES=1
        fi
        
        echo "🔍 Checking for innerHTML usage..."
        if grep -r "\.innerHTML\s*=" "$EXTENSION_DIR/" --include="*.js" 2>/dev/null; then
          echo "ℹ️ innerHTML usage found - ensure content is sanitized"
        fi
        
        if [ "$SECURITY_ISSUES" -eq 0 ]; then
          echo "✅ No obvious security issues found"
        else
          echo "⚠️ Security warnings found - please review"
        fi
    
    # Generate build info
    - name: Generate build info
      run: |
        echo "Generating build information..."
        
        # Create build info file
        cat > build-info.json << EOF
        {
          "build_time": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
          "commit_sha": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "workflow_run": "${{ github.run_number }}",
          "actor": "${{ github.actor }}",
          "repository": "${{ github.repository }}"
        }
        EOF
        
        echo "✅ Build info generated:"
        cat build-info.json
    
    # Package extension with build artifacts
    - name: Package extension
      run: |
        echo "Creating extension package with build artifacts..."
        
        # Create build directory
        mkdir -p build
        
        # Copy extension files to build directory
        cp -r gemini-summarizer/* build/
        
        # Add build info to the package
        cp build-info.json build/
        
        # Create a README for the build
        cat > build/BUILD_README.md << EOF
        # Chrome Extension Build
        
        **Build Information:**
        - Build Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        - Commit: ${{ github.sha }}
        - Branch: ${{ github.ref_name }}
        - Workflow Run: ${{ github.run_number }}
        - Built by: ${{ github.actor }}
        
        **Installation:**
        1. Open Chrome and go to \`chrome://extensions/\`
        2. Enable "Developer mode" (toggle in top-right)
        3. Click "Load unpacked" and select this folder
        
        **Files included:**
        - All extension source files
        - build-info.json (build metadata)
        - This README
        EOF
        
        # Create the zip package
        cd build
        zip -r ../chrome-extension-v${{ github.run_number }}.zip . -x "*.git*" "node_modules/*"
        cd ..
        
        echo "✅ Extension packaged successfully"
        ls -la chrome-extension-v${{ github.run_number }}.zip
        
        # Also create a source-only package (without build artifacts)
        cd gemini-summarizer
        zip -r ../chrome-extension-source.zip . -x "*.git*" "node_modules/*"
        cd ..
        
        echo "✅ Source package created"
        ls -la chrome-extension-source.zip
    
    # Upload the build artifacts
    - name: Upload extension package with build info
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension-v${{ github.run_number }}
        path: |
          chrome-extension-v${{ github.run_number }}.zip
          build-info.json
        retention-days: 90
    
    # Upload source-only package
    - name: Upload source package
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension-source
        path: chrome-extension-source.zip
        retention-days: 30
    
    # Upload unpackaged build directory for easy testing
    - name: Upload unpacked extension
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension-unpacked
        path: build/
        retention-days: 30

  # Run comprehensive tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate
    if: always() && needs.validate.result == 'success'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    # Install dependencies
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    # Run tests
    - name: Run unit tests
      run: npm test
    
    # Run linting
    - name: Run ESLint
      run: npm run lint
    
    # Run custom extension validation
    - name: Run extension validation script
      run: npm run validate
    
    # Generate test coverage report
    - name: Generate coverage report
      run: npm run test:coverage
    
    # Upload coverage to artifacts
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30